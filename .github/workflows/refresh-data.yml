name: Refresh data

# Pulls fresh Nansen data into public/data/ and commits it.
#
# Requires the NANSEN_API_KEY repository secret. Until that secret exists the
# scheduled runs fail fast at the fetch step and nothing is committed.
#
# Every endpoint the fetcher calls sits in the ✅ Allowed tier of Nansen's Data
# Redistribution Guidelines, so this snapshot is safe to republish with the
# attribution the app already carries:
# https://docs.nansen.ai/guides/redistribution-guide
#
# Budget, per chain in the matrix:
#   feed-only  5 credits x 4 runs/day  =  20
#   full      36 credits x 1 run/day   =  36
#                                       ----
#                                         56 credits/day/chain
# Two chains (robinhood, solana) = **112 credits/day**.

on:
  schedule:
    # feed only — replays the tokens already in tank.json (5 credits x 4/day/chain)
    - cron: '17 */6 * * *'
    # full refresh — re-casts the tokens and the roster (36 credits x 1/day/chain)
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: What to refresh
        type: choice
        options:
          - feed
          - full
        default: feed

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    strategy:
      # One chain at a time: every job commits and pushes to the same branch,
      # so running them in parallel would just make them rebase over each other.
      max-parallel: 1
      # A chain whose API call fails should not stop the other from refreshing.
      fail-fast: false
      matrix:
        chain: [robinhood, solana]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch ${{ matrix.chain }}
        env:
          NANSEN_API_KEY: ${{ secrets.NANSEN_API_KEY }}
          # The daily cron and an explicit "full" dispatch do the whole tank;
          # everything else refreshes the feed only.
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
          CHAIN: ${{ matrix.chain }}
        run: |
          set -euo pipefail
          if [ -z "${NANSEN_API_KEY:-}" ]; then
            echo "::error::NANSEN_API_KEY secret is not set — see docs before enabling this workflow."
            exit 1
          fi
          if [ "$SCHEDULE" = "0 9 * * *" ] || [ "$MODE" = "full" ]; then
            echo "full refresh: $CHAIN"
            node scripts/fetch.mjs "$CHAIN"
          else
            echo "feed-only refresh: $CHAIN"
            node scripts/fetch.mjs "$CHAIN" --feed-only
          fi

      - name: Commit and push
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- public/data)" ]; then
            echo "no data changes for ${{ matrix.chain }}"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/data
          git commit -m 'chore(data): refresh ${{ matrix.chain }} snapshot'
          git push || { git pull --rebase --autostash && git push; }

  # A push made with GITHUB_TOKEN does not fire the `push` trigger, so the
  # deploy is invoked directly instead of waiting for an event that never comes.
  #
  # It runs once the whole matrix is done rather than per chain, and it is not
  # gated on anything having changed: a matrix cannot hand a single "changed"
  # flag to a downstream job, and a Pages deploy of an unchanged static site is
  # idempotent and takes seconds. Better a redundant deploy than a missed one.
  #
  # `!cancelled()` rather than the default success gate: with fail-fast off, one
  # chain can fail while the other has already committed good data, and that
  # data should still reach the site.
  deploy:
    needs: refresh
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
